{% extends "applications/base.html" %}
{% block content %}

<div class="max-w-sm mx-auto py-20">
    <h1 class="text-2xl font-bold mb-8 text-center">Login</h1>
    <form method="post" class="grid gap-5">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-md font-medium transition w-full">Login</button>
    </form>
</div>

<style>
    input {
        width: 100%;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        color: #f9fafb;
        font-size: 0.875rem;
    }
</style>

{% endblock %}
