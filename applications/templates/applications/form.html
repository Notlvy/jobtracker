{% extends "applications/base.html" %}
{% block content %}

<div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-bold mb-8">{{ title }}</h1>
    <form method="post" class="grid gap-5">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <div class="flex gap-3 mt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-md font-medium transition">Save</button>
            <a href="{% url 'application_list' %}" class="text-gray-400 hover:text-white px-5 py-2 transition">Cancel</a>
        </div>
    </form>
</div>

<style>
    input, select, textarea {
        width: 100%;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        color: #f9fafb;
        font-size: 0.875rem;
    }
    input:focus, select:focus, textarea:focus {
        outline: 2px solid #6366f1;
        border-color: transparent;
    }
    /* Fix the dropdown arrow color on Windows */
    select option {
        background: #1f2937;
        color: #f9fafb;
    }
</style>

{% endblock %}
