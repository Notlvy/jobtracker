<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><rect x='9' y='11' width='14' height='2.5' rx='1.25' fill='white'/><rect x='9' y='15.5' width='11' height='2.5' rx='1.25' fill='%23a5b4fc'/><rect x='9' y='20' width='12' height='2.5' rx='1.25' fill='%23a5b4fc' opacity='0.6'/><circle cx='26' cy='6' r='5' fill='%2322c55e'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <nav class="bg-gray-900 border-b border-gray-800 px-10 py-4 flex justify-between items-center">
    <a href="{% url 'application_list' %}" class="flex items-center gap-2 no-underline self-center">
        <div class="relative">
            <div class="w-7 h-7 bg-indigo-600 rounded-md flex flex-col justify-center gap-1 px-1.5">
                <div class="h-0.5 w-3 bg-white rounded-full"></div>
                <div class="h-0.5 w-2.5 bg-indigo-300 rounded-full"></div>
                <div class="h-0.5 w-2.5 bg-indigo-300 rounded-full opacity-60"></div>
            </div>
            <div class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-gray-900"></div>
        </div>
        <span class="text-base font-bold tracking-tight">
            <span class="text-white">Job</span><span class="text-indigo-400">Tracker</span>
        </span>
    </a>

    <div class="flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-full px-4 py-1.5">
        <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
        <span class="text-xs text-gray-300 font-medium">Google Sheets Integration coming soon</span>
    </div>

    <div class="flex gap-4 items-center text-sm">
        {% if user.is_authenticated %}
            <span class="text-gray-400">{{ user.username }}</span>
            <a href="{% url 'application_create' %}" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-md font-medium transition">+ Add</a>
            <a href="{% url 'export_csv' %}" class="text-gray-400 hover:text-white transition">Export</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="text-gray-400 hover:text-white transition">Logout</button>
            </form>
        {% endif %}
    </div>
</nav>

    <main class="max-w-5xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
